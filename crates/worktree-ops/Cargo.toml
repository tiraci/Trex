[package]
name = "trex-worktree-ops"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# The worktree lifecycle — the host-derived path scheme, create-with-rollback,
# the pre-remove cleanup script — plus remote-host's `WorktreeService` seam
# implemented over them.
#
# Extracted from the desktop (zero gpui imports) for the same reason
# `relay-terminals` was: `TREX serve` has to create the SAME worktree the
# sidebar lists, and a second implementation would drift on the parts that are
# easy to get subtly wrong — the rollback ladder when the DB insert fails after
# git already made the worktree, and the refusal to remove a row that points at
# the project root.

[dependencies]
trex-core = { workspace = true }
trex-git = { workspace = true }
trex-storage = { workspace = true }
# Deliberately without `features = ["gpui"]`: this crate reads only
# `project_scripts` (`ScriptKind`, `load_for_project`), which is not gated on
# it. Asking for gpui here would pull the UI toolkit into `trex-cli` through
# this edge — the headless host is exactly the consumer the feature spares.
trex-settings = { workspace = true }
trex-remote-host = { workspace = true }
trex-remote-proto = { workspace = true }
# `no_window` on the cleanup subprocess: a teardown script must not flash a
# console on Windows.
trex-no-window = { workspace = true }
# `.TREXinclude` matching. Already in the tree (the file-tree backend uses
# it), and gitignore semantics are exactly what the include file promises —
# hand-rolling globs here would diverge from the syntax users already know.
# Only `gitignore::Gitignore` is used: the walk is our own, because it has to
# be anchored and budgeted (see `include.rs`).
ignore = { workspace = true }
async-trait = { workspace = true }
# Canonical paths WITHOUT the `\\?\` verbatim prefix `std::fs::canonicalize`
# adds on Windows: a minted path becomes a `git worktree add` argument, a
# stored `worktree_path`, and the rail's displayed text, and Git for Windows
# does not take verbatim paths.
dunce = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
