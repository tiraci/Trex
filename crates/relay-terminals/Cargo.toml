[package]
name = "trex-relay-terminals"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

# remote-host's TerminalSource seam implemented over the relay daemon —
# extracted from the desktop (zero gpui imports) so `TREX serve` exposes the
# same terminals the same way, gap semantics included, instead of forking 200
# lines of subtle queue/backpressure logic.

[dependencies]
trex-relay-client = { workspace = true }
trex-relay-proto = { workspace = true }
trex-remote-host = { workspace = true }
trex-remote-proto = { workspace = true }
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

# The size-vote contract this crate translates lives in the daemon, not here, so
# the tests boot a real one in-process rather than asserting against a stand-in
# that would agree with whatever this file happened to do.
[dev-dependencies]
trex-relay = { workspace = true }
trex-shell-env = { workspace = true, features = ["test-support"] }
tempfile = "3"
