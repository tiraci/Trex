[package]
name = "trex-ssh"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
trex-core = { workspace = true }
trex-git = { workspace = true }
trex-pty = { workspace = true }
trex-relay-proto = { workspace = true }
trex-shell-env = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
